[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computebasis"
version = "0.6.0"
description = "Read-only compute evidence, normalization, pricing and dated cash simulations"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "numpy==2.3.5", "certifi==2026.7.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compute_pricing.control.workbench" = ["assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]

